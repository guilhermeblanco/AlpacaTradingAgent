name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: tradingagents_test
          POSTGRES_USER: tradingagents
          POSTGRES_PASSWORD: tradingagents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U tradingagents -d tradingagents_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[app,dev]"

      - name: Run test suite
        # No API keys are configured on purpose: the suite must stay runnable
        # offline.
        env:
          TEST_DATABASE_URL: postgresql+psycopg://tradingagents:tradingagents@localhost:5432/tradingagents_test
        run: python -m pytest tests/ -v --tb=short
