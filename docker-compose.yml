services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpaca-trading-agent:web
    container_name: alpaca-trading-agent-web
    init: true
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      PORT: "7860"
      SERVER_NAME: "0.0.0.0"
      TZ: "${TZ:-America/New_York}"
      TRADINGAGENTS_CACHE_DIR: /app/tradingagents/dataflows/data_cache
      TRADINGAGENTS_RESULTS_DIR: /app/eval_results
      TRADINGAGENTS_MEMORY_LOG_PATH: /app/.tradingagents/memory/trading_memory.md
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents}@postgres:5432/${POSTGRES_DB:-tradingagents}"
      PERSISTENCE_BACKEND: "${PERSISTENCE_BACKEND:-postgres}"
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${HOST_PORT:-7860}:7860"
    restart: unless-stopped
    stop_grace_period: 30s
    volumes:
      - data-cache:/app/tradingagents/dataflows/data_cache
      - eval-results:/app/eval_results
      - trading-state:/app/.tradingagents

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpaca-trading-agent:web
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents}@postgres:5432/${POSTGRES_DB:-tradingagents}"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  evaluation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpaca-trading-agent:web
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents}@postgres:5432/${POSTGRES_DB:-tradingagents}"
      PERSISTENCE_BACKEND: "postgres"
      EVALUATION_PRICE_PROVIDER: "${EVALUATION_PRICE_PROVIDER:-alpaca}"
      EVALUATION_HORIZONS_DAYS: "${EVALUATION_HORIZONS_DAYS:-1,5,20}"
      EVALUATION_ESTIMATED_COST_PCT: "${EVALUATION_ESTIMATED_COST_PCT:-0.10}"
      EVALUATION_WORKER_INTERVAL_SECONDS: "${EVALUATION_WORKER_INTERVAL_SECONDS:-300}"
    command: ["python", "-m", "tradingagents.evaluation.worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tradingagents.operations.control_plane", "check", "evaluation-worker", "--stale-after-seconds", "900"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    stop_grace_period: 30s

  reconciliation-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: alpaca-trading-agent:web
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents}@postgres:5432/${POSTGRES_DB:-tradingagents}"
      PERSISTENCE_BACKEND: "postgres"
      EVALUATION_PRICE_PROVIDER: "${EVALUATION_PRICE_PROVIDER:-alpaca}"
      RECONCILIATION_WORKER_INTERVAL_SECONDS: "${RECONCILIATION_WORKER_INTERVAL_SECONDS:-5}"
      RECONCILIATION_LEASE_SECONDS: "${RECONCILIATION_LEASE_SECONDS:-60}"
      RECONCILIATION_POLL_SECONDS: "${RECONCILIATION_POLL_SECONDS:-5}"
    command: ["python", "-m", "tradingagents.execution.reconciliation_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tradingagents.operations.control_plane", "check", "reconciliation-worker", "--stale-after-seconds", "30"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    stop_grace_period: 30s

  autonomous-worker:
    profiles: ["autonomous"]
    build:
      context: .
      dockerfile: Dockerfile
    image: alpaca-trading-agent:web
    env_file:
      - ${ENV_FILE:-.env}
    environment:
      DATABASE_URL: "postgresql+psycopg://${POSTGRES_USER:-tradingagents}:${POSTGRES_PASSWORD:-tradingagents}@postgres:5432/${POSTGRES_DB:-tradingagents}"
      PERSISTENCE_BACKEND: "postgres"
      AUTONOMOUS_ENABLED: "${AUTONOMOUS_ENABLED:-false}"
      EXECUTION_BROKER: "${EXECUTION_BROKER:-alpaca}"
      EXECUTION_GATEWAY: "${EXECUTION_GATEWAY:-dry-run}"
    command: ["python", "-m", "tradingagents.orchestration.autonomous_worker"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-m", "tradingagents.operations.control_plane", "check", "autonomous-worker", "--stale-after-seconds", "3600"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 120s
    restart: unless-stopped
    stop_grace_period: 60s

  postgres:
    image: postgres:17-alpine
    container_name: alpaca-trading-agent-postgres
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-tradingagents}"
      POSTGRES_USER: "${POSTGRES_USER:-tradingagents}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-tradingagents}"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tradingagents} -d ${POSTGRES_DB:-tradingagents}"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  data-cache:
  eval-results:
  trading-state:
  postgres-data:
