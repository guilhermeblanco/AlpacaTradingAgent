[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.1.0"
description = "Auditable multi-agent trading research and broker execution framework"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "TradingAgents Team" }]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "typing-extensions>=4.12",
]

[project.optional-dependencies]
analysis = [
  "beautifulsoup4>=4.12",
  "chromadb>=0.5",
  "eodhd>=1.0",
  "feedparser>=6.0",
  "finnhub-python>=2.4",
  "httpx>=0.27",
  "langchain-anthropic>=1.4.2,<2.0.0",
  "langchain-core>=1.3.2,<2.0.0",
  "langchain-experimental>=0.4.1,<0.5.0",
  "langchain-google-genai>=4.2.2,<5.0.0",
  "langchain-openai>=1.2.1,<2.0.0",
  "langgraph>=1.1.10,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
  "openai>=2.33.0,<3.0.0",
  "praw>=7.7",
  "python-dateutil>=2.9",
  "stockstats>=0.5.4",
  "tenacity>=8.2",
  "yfinance>=0.2",
]
brokers = [
  "alpaca-py>=0.8.2",
  "cryptography>=42",
  "exchange-calendars>=4.5,<5.0",
]
postgres = [
  "SQLAlchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "psycopg[binary]>=3.2,<4.0",
]
cli = [
  "questionary>=2.0.1",
  "rich>=13.0",
  "typer>=0.12",
]
web = [
  "dash>=3.0",
  "dash-bootstrap-components>=2.0",
  "flask>=3.0",
  "gradio>=4.0",
  "plotly>=5.18",
  "pytz>=2024.1",
]
backtest = ["backtrader>=1.9"]
extended-data = [
  "akshare>=1.14",
  "parsel>=1.9",
  "tushare>=1.4",
]
redis = ["redis>=5.0"]
app = [
  "SQLAlchemy>=2.0,<3.0",
  "akshare>=1.14",
  "alembic>=1.13,<2.0",
  "alpaca-py>=0.8.2",
  "backtrader>=1.9",
  "beautifulsoup4>=4.12",
  "chromadb>=0.5",
  "cryptography>=42",
  "dash>=3.0",
  "dash-bootstrap-components>=2.0",
  "eodhd>=1.0",
  "exchange-calendars>=4.5,<5.0",
  "feedparser>=6.0",
  "finnhub-python>=2.4",
  "flask>=3.0",
  "gradio>=4.0",
  "httpx>=0.27",
  "langchain-anthropic>=1.4.2,<2.0.0",
  "langchain-core>=1.3.2,<2.0.0",
  "langchain-experimental>=0.4.1,<0.5.0",
  "langchain-google-genai>=4.2.2,<5.0.0",
  "langchain-openai>=1.2.1,<2.0.0",
  "langgraph>=1.1.10,<2.0.0",
  "langgraph-checkpoint-sqlite>=3.0.3,<4.0.0",
  "openai>=2.33.0,<3.0.0",
  "parsel>=1.9",
  "plotly>=5.18",
  "praw>=7.7",
  "psycopg[binary]>=3.2,<4.0",
  "python-dateutil>=2.9",
  "questionary>=2.0.1",
  "redis>=5.0",
  "rich>=13.0",
  "pytz>=2024.1",
  "stockstats>=0.5.4",
  "tenacity>=8.2",
  "tqdm>=4.66",
  "tushare>=1.4",
  "typer>=0.12",
  "yfinance>=0.2",
]
dev = [
  "build>=1.2",
  "pytest>=8.3",
]

[project.scripts]
tradingagents = "cli.main:app"
tradingagents-web = "run_webui_dash:main"

[tool.setuptools]
include-package-data = true
py-modules = ["run_webui_dash"]

[tool.setuptools.packages.find]
where = ["."]
include = ["tradingagents*", "cli*", "webui*"]
namespaces = true

[tool.setuptools.package-data]
"tradingagents.prompts" = ["templates/*.md", "templates/*/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
